name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast feedback: everything that doesn't need a browser. Runs on its own so a lint or unit
  # test failure reports in under a minute instead of behind a Chromium download.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --test test/*.test.mjs

  # The parts that need real headless Chromium. Split from `check` so its ~1 minute of
  # browser install isn't in the way of a typo-level failure.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # examples/gallery/pixel-look.ts's "pixel" texture is a post-process run through
      # ffmpeg (see AGENTS.md's texture reference) rather than an SVG filter like every
      # other texture, so it's the one example in the whole smoke-render sweep that needs
      # ffmpeg on PATH — ubuntu-latest doesn't ship it by default.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Determinism is a load-bearing guarantee (seeded jitter, randomize:false eases,
      # precomputed springs) — two renders of the same scene at the same t must be
      # byte-identical, or an agent can no longer reproduce or compare frames.
      - name: Determinism check
        run: |
          node bin/sketchling.js render examples/potted-plant.ts --at 1.8 --out /tmp/det-a.png
          node bin/sketchling.js render examples/potted-plant.ts --at 1.8 --out /tmp/det-b.png
          cmp /tmp/det-a.png /tmp/det-b.png

      # Every example, every time. This only catches loud failures (a throw, a non-zero
      # exit) — a silently-wrong render still needs a human to look at it — but loud
      # failures used to slip through unnoticed until someone happened to render that one
      # example by hand.
      - name: Smoke-render every example
        run: node scripts/smoke-render.mjs

      # Builds site/ and drives the playground through the same Chromium: it renders in a
      # page, not through the CLI, so nothing above would catch it breaking.
      - name: Playground
        run: npm run test:site
